spring.application.name=YukiRepoGuide
yuki.trial-access.code-hash=${YUKI_TRIAL_ACCESS_CODE_HASH}
# Fine-grained PAT：仅服务端使用；公开仓库导览至少授予 Contents: read。
yuki.github.token=${YUKI_GITHUB_TOKEN}
yuki.github.connect-timeout=3s
yuki.github.read-timeout=8s
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
