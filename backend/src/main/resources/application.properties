spring.application.name=YukiRepoGuide
yuki.trial-access.code-hash=${YUKI_TRIAL_ACCESS_CODE_HASH}
# Fine-grained PAT：仅服务端使用；公开仓库导览至少授予 Contents: read。
yuki.github.token=${YUKI_GITHUB_TOKEN}
yuki.github.connect-timeout=3s
yuki.github.read-timeout=8s
# 可选；未配置时介绍与 Quick Start 分别降级，不影响基础导览。
yuki.deepseek.api-key=${YUKI_DEEPSEEK_API_KEY:}
yuki.explanation.snapshot-ttl=10m
yuki.explanation.capacity=128
yuki.explanation.generation-timeout=30s
yuki.explanation.max-input-characters=12000
yuki.explanation.max-introduction-characters=300
yuki.explanation.max-response-bytes=32768
yuki.quick-start.generation-timeout=45s
yuki.quick-start.max-input-characters=24000
yuki.quick-start.max-response-bytes=65536
yuki.quick-start.max-tokens=4096
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
